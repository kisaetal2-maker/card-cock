
name: Build CardCock Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "card-cock-android.zip"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unpack project
        run: |
          unzip -q card-cock-android.zip -d android-source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/android-source/card-cock-android-fixed" >> $GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: card-cock-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
